<style>

:root[data-theme="dark"]{--bg:#0b0f1e;--panel:#141a33;--text:#eef1ff;--muted:#8d97c4;--line:#2a3360}
*{box-sizing:border-box}
html,body{height:100%;margin:0}

<body>
<div id="game">
  <div id="top"><div id="tl"><h1>Planets Merge <span><button id="pz">⏸</button> <button id="mu">🔊</button></span></h1><div id="tbw"><div id="tb"></div></div><div id="tt"></div><div id="sk">Strikes ○○○</div></div><div id="tr"><div id="score">Score 0</div><div id="nx"><canvas id="nc" width="52" height="52"></canvas><span id="nn">Next</span></div></div></div>
  <div id="chain"></div>
  <div id="wrap"><div id="stage">
    <canvas id="c" width="320" height="440"></canvas>
    <div id="toast"></div><div id="pause"><b>⏸ Paused</b><button id="resume">Resume</button><button id="restart">Restart</button></div><div id="msg"><b id="mt"></b><div id="ms"></div><ol class="lb" id="lb2"></ol><div class="row"><button id="again">Play again</button><button id="menu">Menu</button></div></div></div>
  </div>
<div id="start">
  <h2>🪐 Planets Merge</h2>
  <p>Merge planets, survive the black holes, reach the Sun — then go supernova. 🔥 Hard mode.</p>
  <input id="nm" maxlength="14" placeholder="Your name" autocomplete="off">

  <h3>🏆 Top 10</h3>
  <ol class="lb" id="lb1"></ol>
  <small id="lbnote"></small>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const P=[
 {n:"Pluto",r:18,c:"#d9a07a"},{n:"Mercury",r:24,c:"#8a8580"},{n:"Mars",r:28,c:"#d1553a"},{n:"Venus",r:34,c:"#e8c27a"},
 {n:"Earth",r:35,c:"#3b82f6"},{n:"Neptune",r:59,c:"#3f5fd8"},{n:"Uranus",r:60,c:"#7fe0e6"},
 {n:"Saturn",r:83,c:"#e3c98d"},{n:"Jupiter",r:91,c:"#c98a5b"},{n:"Sun",r:108,c:"#ffb41f"}
];
const W=250,ZONE=340;let H=440,LINE=H-ZONE,K=1,SPY=40,floor;
const {Engine,Bodies,Composite,Body,Events}=Matter;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const chain=document.getElementById('chain');
P.forEach(p=>{const d=document.createElement('div');d.innerHTML='<i style="background:'+p.c+';width:'+(6+p.r/4.5)+'px;height:'+(6+p.r/4.5)+'px"></i>'+p.n.slice(0,3);chain.appendChild(d)});
let TLIM=6;const STEP=1000/60;
P.push({n:'Moon',r:19,c:'#eef0ff'});P.push({n:'Disco',r:18,c:'#ff5cc8'});P.push({n:'Rock',r:17,c:'#6b6560'});const SUN=9,MOONLV=10,DISCOLV=11,ASTER=12;let acc=0,mq=[],moonHit=null,ac=null,mute=false,quiet=false,seen={},tt2,strikes=0,moonNew=[],discoOwed=0,nextDisco=1000,dance=null,danceIv=null,nova=null,paused=false,pausedAt=0,rings=[];
let engine,bodies,score,over,aimX,canDrop,overT,stars=[],held=false,dispX=160,aimV=0,parts=[],cur=0,nxt=0,tl=8,bh=null;
for(let i=0;i<50;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.4+.3]);
function make(i,x,y){
  const b=Bodies.circle(x,y,P[i].r,{restitution:.5,friction:.005,frictionStatic:0,frictionAir:.002,slop:.02,density:0.001*(1+i*.25)});
  b.lv=i;b.born=performance.now();return b;
}
function reset(){
  engine=Engine.create({positionIterations:8,velocityIterations:6});engine.gravity.y=1.9;
  Composite.add(engine.world,[
    floor=Bodies.rectangle(W/2,H+25,W+100,50,{isStatic:true}),
    Bodies.rectangle(-25,300,50,2400,{isStatic:true}),
    Bodies.rectangle(W+25,300,50,2400,{isStatic:true})]);
  bodies=[];score=0;over=false;aimX=W/2;canDrop=true;overT=0;saved=false;windT=15000;windOn=0;windWarn=0;streaks=[];drops=0;nova=null;cv.style.transform='';discoOwed=0;nextDisco=1000;stopDance();cur=rnd();nxt=rnd();tl=TLIM;bh=null;strikes=0;seen={};updStrikes();moonNote();
  document.getElementById('msg').style.display='none';
  upd();
  Events.on(engine,'collisionStart',onHit);
}
function upd(){document.getElementById('score').textContent='Score '+score;applyTier()}
function rnd(){if(discoOwed>0){discoOwed--;return DISCOLV}const r=Math.random();return r<.005?MOONLV:r<.45?0:r<.75?1:r<.92?2:3}

function toast(name,color,isNew,sub,ms){
  const el=document.getElementById('toast');
  el.innerHTML='<span style="color:'+color+'">'+name+'</span>'+(isNew?'<em>NEW!</em>':'')+(sub?'<small>'+sub+'</small>':'');
  el.classList.add('on');clearTimeout(tt2);tt2=setTimeout(()=>el.classList.remove('on'),ms||1600);
}
function toastH(h,ms){const el=document.getElementById('toast');el.innerHTML=h;el.classList.add('on');clearTimeout(tt2);tt2=setTimeout(()=>el.classList.remove('on'),ms||1600)}
function updStrikes(){document.getElementById('sk').textContent='Strikes '+'\u25cf'.repeat(strikes)+'\u25cb'.repeat(Math.max(0,3-strikes))+'   Lv '+(1+Math.floor(score/2000))}
function startBig(){sfx('hole');bh={x:W/2,y:H/2,r:0,t:0,ph:0,big:true,tg:null}}
function bigStep(dt){
  bh.t+=dt;
  if(bh.ph===0){bh.r=Math.min(120,bh.t/10);if(bh.t>1300){bh.ph=1;bh.t=0;for(const o of bodies)o.isSensor=true}}
  else{
    for(const o of bodies){
      const dx=bh.x-o.position.x,dy=bh.y-o.position.y,d=Math.hypot(dx,dy)||1,s=Math.min(10,3+d*.06);
      Body.setVelocity(o,{x:dx/d*s,y:dy/d*s});o.sc=Math.max(.15,Math.min(1,d/120));
      if(d<16)o.dead=true;
    }
    const g=bodies.filter(o=>o.dead);
    if(g.length){Composite.remove(engine.world,g);bodies=bodies.filter(o=>!o.dead);sfx('eat')}
    if(!bodies.length||bh.t>3000){
      Composite.remove(engine.world,bodies);bodies=[];
      end(false);document.getElementById('mt').textContent='The black hole ate everything!';
    }
  }
}
function moonNote(){if(cur===DISCOLV)toast('🌈 Disco!','#ff9fe5',false,'Throw it: everyone dances!',2400);if(cur===MOONLV)toast('🌙 Moon','#e6e9ff',false,'Drop it: every matching pair merges!',2400)}
const EM=['joy','cool','oh','love','wink','smile','oh','love','cool','joy'];
function heart(x,y,s){ctx.fillStyle='#ff3b6b';ctx.beginPath();ctx.moveTo(x,y+s*.6);ctx.bezierCurveTo(x-s*1.1,y-s*.1,x-s*.5,y-s*.9,x,y-s*.3);ctx.bezierCurveTo(x+s*.5,y-s*.9,x+s*1.1,y-s*.1,x,y+s*.6);ctx.fill()}
function stopDance(){dance=null;if(danceIv){clearInterval(danceIv);danceIv=null}}
function startDance(){
  dance={t0:performance.now()};sfx('disco');
  let n=0;if(danceIv)clearInterval(danceIv);
  danceIv=setInterval(()=>{
    if(paused)return;if(!dance||gn()-dance.t0>30000){stopDance();return}
    if(n%2===0)tone(120,.14,'sine',.28,45);else tone(5500,.04,'square',.04);
    if(n%4===0)tone([110,110,147,165][(n/4)%4|0],.2,'sawtooth',.07);
    n++;
  },250);
}
function danceDraw(b){
  const l=b.lv,r=P[l].r,e=gn()-dance.t0,bt=Math.max(0,e-250)/500,PI=Math.PI;
  const amp=Math.max(0,Math.min(1,e/900,(30000-e)/900));
  let dx=0,dy=0,rot=0,sx=1,sy=1;
  const u=bt%1,arc=4*u*(1-u),land=Math.max(0,1-Math.min(u,1-u)*7);
  const sm=x=>x*x*x*(x*(x*6-15)+10);
  if(l===0){dy=-arc*r*1.5;sy=1+arc*.12-land*.22;sx=1/sy}
  else if(l===1){const k=Math.min(1,((bt/2)%1)/.6);rot=sm(k)*2*PI;dy=-Math.sin(PI*k)*r*.3}
  else if(l===2){dx=Math.sin(bt*PI/2)*r*.9;rot=Math.cos(bt*PI/2)*.25;dy=-Math.abs(Math.sin(bt*PI))*r*.12}
  else if(l===3){const a=Math.sin(bt*PI/2)*.45;dx=r*Math.sin(a);dy=r*(1-Math.cos(a));rot=a}
  else if(l===4){dx=Math.cos(bt*PI/2)*r*.35;dy=Math.sin(bt*PI/2)*r*.18;rot=bt*.4}
  else if(l===5){dy=Math.sin(bt*PI)*r*.28;dx=Math.sin(bt*PI/2)*r*.2;rot=Math.cos(bt*PI)*.22}
  else if(l===6){dx=Math.sin(bt*PI/2)*r*.8;rot=dx/r}
  else if(l===7){dx=Math.cos(bt*PI)*r*.2;dy=Math.sin(bt*PI)*r*.2;rot=Math.sin(bt*PI)*.12}
  else if(l===8){const v=(bt/2)%1,ar=4*v*(1-v),ld=Math.max(0,1-Math.min(v,1-v)*7);dy=-ar*r*.35;sy=1+ar*.06-ld*.2;sx=1/sy}
  else if(l===9){sx=sy=1+Math.sin(bt*PI*2)*.05;rot=bt*.25}
  dx*=amp;dy*=amp;rot*=amp;sx=1+(sx-1)*amp;sy=1+(sy-1)*amp;dy+=(1-sy)*r;
  ctx.save();ctx.translate(b.position.x+dx,b.position.y+dy);ctx.scale(sx,sy);
  disc(0,0,l,(b.angle||0)+rot,b,EM[l]||'joy');
  ctx.restore();
}
function drawDisco(){
  if(!dance)return;
  const e=gn()-dance.t0,t=e/1000,ease=Math.max(0,Math.min(1,e/1200,(30000-e)/1200));
  const bx=W/2,R=26,by=-40+ease*104,hue=(t*120)%360;
  ctx.save();
  ctx.globalAlpha=.08*ease;ctx.fillStyle='hsl('+hue+',100%,60%)';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='lighter';
  for(let k=0;k<8;k++){
    const a=t*.8+k*Math.PI/4;
    ctx.fillStyle='hsla('+((hue+k*45)%360)+',100%,60%,'+(.1*ease)+')';
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a-.08)*700,by+Math.sin(a-.08)*700);ctx.lineTo(bx+Math.cos(a+.08)*700,by+Math.sin(a+.08)*700);ctx.closePath();ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='#888';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,0);ctx.lineTo(bx,by-R);ctx.stroke();
  const g=ctx.createRadialGradient(bx-8,by-8,3,bx,by,R);g.addColorStop(0,'#fff');g.addColorStop(1,'#7a7f99');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.clip();ctx.strokeStyle='rgba(30,30,60,.5)';ctx.lineWidth=1;
  for(let k=-R;k<=R;k+=6){ctx.beginPath();ctx.moveTo(bx-R,by+k);ctx.lineTo(bx+R,by+k);ctx.stroke();const o=bx+k+(t*20%6);ctx.beginPath();ctx.moveTo(o,by-R);ctx.lineTo(o,by+R);ctx.stroke()}
  ctx.restore();
  ctx.fillStyle='#fff';
  for(let k=0;k<6;k++){const a=t*2+k*1.05;ctx.globalAlpha=.5+.5*Math.sin(t*9+k);ctx.fillRect(bx+Math.cos(a)*(R+8),by+Math.sin(a)*(R+8),3,3)}
  ctx.restore();
}
function supernova(a,b){
  a.dead=b.dead=true;
  nova={t0:performance.now(),mx:(a.position.x+b.position.x)/2,my:(a.position.y+b.position.y)/2,s:[{x:a.position.x,y:a.position.y},{x:b.position.x,y:b.position.y}],cleared:false};
  Composite.remove(engine.world,[a,b]);bodies=bodies.filter(o=>!o.dead);
  score+=500;upd();over=true;stopDance();tone(80,.9,'sawtooth',.2,40);
}
function novaStep(){
  if(!nova)return;
  const t=gn()-nova.t0;
  if(t>1500&&!nova.cleared){nova.cleared=true;Composite.remove(engine.world,bodies);bodies=[];sfx('nova')}
  if(t<2600){const m=t>900?10:t/90;cv.style.transform='translate('+((Math.random()-.5)*m)+'px,'+((Math.random()-.5)*m)+'px)'}else cv.style.transform='';
  if(t>4200){cv.style.transform='';nova=null;end(true)}
}
function drawNova(){
  if(!nova)return;
  const t=gn()-nova.t0;
  ctx.save();
  if(t<900){
    const e=Math.pow(t/900,2);
    for(const s of nova.s){disc(s.x+(nova.mx-s.x)*e,s.y+(nova.my-s.y)*e,SUN,t/300,null,'oh')}
    const g=ctx.createRadialGradient(nova.mx,nova.my,0,nova.mx,nova.my,40+e*60);
    g.addColorStop(0,'rgba(255,255,255,'+e+')');g.addColorStop(1,'rgba(255,160,40,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }else{
    const u=t-900,R=Math.min(900,u*.55),fa=Math.max(0,Math.min(1,1-(u-1400)/1600));
    ctx.globalAlpha=fa;
    const g=ctx.createRadialGradient(nova.mx,nova.my,0,nova.mx,nova.my,R);
    g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,220,90,.95)');g.addColorStop(.7,'rgba(255,90,20,.7)');g.addColorStop(1,'rgba(255,40,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;ctx.lineWidth=6;
    for(let k=0;k<3;k++){const rr=Math.max(0,u-k*250)*.6;ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,1-rr/700)+')';ctx.beginPath();ctx.arc(nova.mx,nova.my,rr,0,7);ctx.stroke()}
    ctx.save();ctx.translate(nova.mx,nova.my);ctx.fillStyle='rgba(255,240,200,'+Math.max(0,.5-u/2500)+')';
    for(let k=0;k<12;k++){ctx.rotate(Math.PI/6);ctx.fillRect(0,-3,Math.min(900,u*.7),6)}
    ctx.restore();
    const w=u<600?u/600:Math.max(0,1-(u-900)/1000);
    ctx.fillStyle='rgba(255,255,255,'+Math.max(0,Math.min(1,w))+')';ctx.fillRect(0,0,W,H);
    if(u>1100){ctx.globalAlpha=Math.min(1,(u-1100)/400);ctx.fillStyle='#fff';ctx.strokeStyle='#ff6a00';ctx.lineWidth=6;ctx.textAlign='center';ctx.font='bold 34px system-ui,sans-serif';ctx.strokeText('SUPERNOVA!',W/2,H/2);ctx.fillText('SUPERNOVA!',W/2,H/2)}
  }
  ctx.restore();
}
function gn(){return paused?pausedAt:performance.now()}
function setPause(p){
  if(p===paused)return;
  if(p&&over)return;
  if(p){pausedAt=performance.now();paused=true}
  else{const d=performance.now()-pausedAt;if(dance)dance.t0+=d;if(nova)nova.t0+=d;paused=false}
  document.getElementById('pause').style.display=paused?'flex':'none';
  document.getElementById('pz').textContent=paused?'▶':'⏸';
  if(paused&&window.speechSynthesis)speechSynthesis.cancel();
}
document.getElementById('pz').onclick=()=>setPause(!paused);
document.getElementById('resume').onclick=()=>setPause(false);
document.getElementById('restart').onclick=()=>{setPause(false);reset()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='p'||e.key==='P'||e.key==='Escape')setPause(!paused)});
function dangerLevel(){
  let m=1e9;const now=performance.now();
  for(const b of bodies){if(b.isSensor||now-b.born<1000)continue;const g=b.position.y-P[b.lv].r-LINE;if(g<m)m=g}
  return m>60?0:Math.max(0,Math.min(1,1-m/60));
}
function drawRings(){
  for(const g of rings){ctx.globalAlpha=Math.max(0,g.l);ctx.strokeStyle=g.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.stroke();if(!paused){g.r+=3.2;g.l-=.05}}
  ctx.globalAlpha=1;rings=rings.filter(g=>g.l>0);

function face(r,t,o,m){
  const sp=o?Math.hypot(o.velocity.x,o.velocity.y):0;
  if(!m){m='smile';if(o&&o.joy>t)m='joy';else if(sp>7)m='oh';else if(o&&o.position.y-r<LINE+35)m='worry'}
  const ex=Math.max(r*.32,3.3),ey=-r*.12,er=Math.max(2.1,r*.19),lw=Math.max(1.5,r*.07),ink='#1d1b34',my=r*.32;
  const blink=((t/1000+(o?o.id:0)*1.7)%3.6)<.13;
  let lx=0,ly=er*.35;
  if(o&&sp>.3){lx=o.velocity.x/sp*er*.4;ly=o.velocity.y/sp*er*.4}
  ctx.lineCap='round';ctx.strokeStyle=ink;
  if(r>=22){ctx.fillStyle='rgba(255,100,140,.4)';for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*r*.55,r*.2,r*.12,r*.08,0,0,7);ctx.fill()}}
  for(const s of[-1,1]){
    const cx=s*ex;
    if(m==='joy'){ctx.lineWidth=lw;ctx.beginPath();ctx.arc(cx,ey+er*.5,er*.8,Math.PI*1.1,Math.PI*1.9);ctx.stroke()}
    else if(m==='love'){heart(cx,ey,er*1.4)}
    else if(m==='cool'){ctx.fillStyle='#111';ctx.fillRect(cx-er*1.3,ey-er*.8,er*2.6,er*1.6)}
    else if(m==='wink'&&s===1){ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(cx-er,ey);ctx.lineTo(cx+er,ey);ctx.stroke()}
    else if(blink){ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(cx-er,ey);ctx.lineTo(cx+er,ey);ctx.stroke()}
    else{
      const e2=m==='oh'?er*1.2:er;
      ctx.fillStyle='#fff';ctx.lineWidth=lw*.6;ctx.beginPath();ctx.arc(cx,ey,e2,0,7);ctx.fill();ctx.stroke();
      ctx.fillStyle=ink;ctx.beginPath();ctx.arc(cx+lx,ey+ly,e2*.55,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx+lx-e2*.15,ey+ly-e2*.2,e2*.18,0,7);ctx.fill();
    }
  }
  ctx.lineWidth=lw;ctx.fillStyle=ink;ctx.beginPath();
  if(m==='joy'){ctx.arc(0,my-r*.08,r*.24,0,Math.PI);ctx.closePath();ctx.fillStyle='#7a1f3d';ctx.fill();ctx.stroke()}
  else if(m==='oh'){ctx.ellipse(0,my+r*.05,r*.1,r*.14,0,0,7);ctx.fill()}
  else if(m==='worry'){ctx.arc(0,my+r*.14,r*.18,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}
  else{ctx.arc(0,my-r*.1,r*.22,Math.PI*.15,Math.PI*.85);ctx.stroke()}
}
function disc(x,y,i,a,o,m){
  const p=P[i],r=p.r,t=performance.now(),d=D[p.n],saturnish=p.n==='Saturn'||p.n==='Uranus';
  ctx.save();ctx.translate(x,y);
  if(p.n==='Disco'){const hue=(performance.now()/6)%360,dg=ctx.createRadialGradient(0,0,r*.8,0,0,r*2.2);dg.addColorStop(0,'hsla('+hue+',100%,65%,.7)');dg.addColorStop(1,'hsla('+hue+',100%,65%,0)');ctx.fillStyle=dg;ctx.beginPath();ctx.arc(0,0,r*2.2,0,7);ctx.fill()}
  if(p.n==='Moon'){const mg=ctx.createRadialGradient(0,0,r*.9,0,0,r*2);mg.addColorStop(0,'rgba(200,210,255,.6)');mg.addColorStop(1,'rgba(200,210,255,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(0,0,r*2,0,7);ctx.fill()}
  if(p.n==='Sun'){const gg=ctx.createRadialGradient(0,0,r*.9,0,0,r*1.35);gg.addColorStop(0,'rgba(255,200,60,.55)');gg.addColorStop(1,'rgba(255,200,60,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,r*1.35,0,7);ctx.fill()}
  if(saturnish)ring(p,r,false);
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();
  ctx.save();ctx.rotate(a||0);
  ctx.fillStyle=p.c;ctx.fillRect(-r*2,-r*2,r*4,r*4);
  if(d.b)for(const [k,w,c] of d.b){ctx.strokeStyle=c;ctx.lineWidth=w*r*2;ctx.beginPath();ctx.moveTo(-r,k*r);ctx.quadraticCurveTo(0,k*r+r*.15,r,k*r);ctx.stroke()}
  if(d.s)for(const [sx,sy,rx,ry,c] of d.s){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(sx*r,sy*r,rx*r,ry*r,0,0,7);ctx.fill()}
  ctx.restore();
  const g=ctx.createRadialGradient(-r*.4,-r*.4,r*.1,-r*.1,-r*.1,r*1.2);
  g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=g;ctx.fillRect(-r,-r,2*r,2*r);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  if(saturnish)ring(p,r,true);
  face(r,t,o,i===ASTER?'worry':m);
  if(ctx===mainCtx){const fs=r>=40?12:10,ly2=r>=28?r*.82:-r-4;ctx.font='bold '+fs+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.fillStyle=i===MOONLV?'#cfe0ff':'#fff';const nm2=i===ASTER&&o?'Rock '+o.hp:p.n;ctx.strokeText(nm2,0,ly2);ctx.fillText(nm2,0,ly2)}
  ctx.restore();
}
let last=performance.now();
function loop(t){
  const dt=paused?0:Math.min(32,t-last);last=t;const pd=dispX;dispX+=(aimX-dispX)*.3;aimV=dispX-pd;for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.l-=.025}parts=parts.filter(q=>q.l>0);
  if(!over){
    acc+=dt;let n=0;while(acc>=STEP&&n<4){Engine.update(engine,STEP);acc-=STEP;n++;flush();clampAll()}if(n===4)acc=0;unstick();if(dance&&gn()-dance.t0>30000)stopDance();if(!dance||bh)tick(dt);
    let hit=false;
    for(const b of bodies)if(!b.isSensor&&t-b.born>1000&&b.position.y-P[b.lv].r<LINE)hit=true;
    overT=hit&&!dance?overT+dt:0;
    if(overT>1000)end(false);
  }
  novaStep();ui();draw();requestAnimationFrame(loop);
}
function fit(){
  const wr=document.getElementById('wrap'),g=document.getElementById('game');
  const aw=wr.clientWidth,ah=wr.clientHeight;if(aw<50||ah<50)return;
  const nh=Math.max(440,Math.min(640,Math.round(W*ah/aw)));
  if(nh!==H){
    H=nh;LINE=H-ZONE;SPY=Math.max(40,LINE-90);
    stars=[];for(let i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.4+.3]);
    if(floor)Body.setPosition(floor,{x:W/2,y:H+25});
  }
  const s=Math.min(aw/W,ah/H),cw=Math.floor(W*s),ch=Math.floor(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  K=Math.min(3,Math.max(1,cw*(window.devicePixelRatio||1)/W));
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
  g.style.setProperty('--cw',cw+'px');g.style.setProperty('--u',Math.max(1,Math.min(1.7,cw/340)).toFixed(2));
}
const FIREBASE_URL='https://merging-planets-default-rtdb.asia-southeast1.firebasedatabase.app';
let saved=false,playerName='';
try{playerName=localStorage.getItem('pm_name')||''}catch(_){}
function localBoard(){try{return JSON.parse(localStorage.getItem('pm_board')||'[]')}catch(_){return[]}}
function topTen(list){
  const best={};
  for(const x of list){if(!x||typeof x.name!=='string'||typeof x.score!=='number')continue;const k=x.name.toLowerCase();if(!best[k]||x.score>best[k].score)best[k]=x}
  return Object.values(best).sort((a,b)=>b.score-a.score).slice(0,10);
}
async function loadBoard(){
  let list=[];
  if(FIREBASE_URL){try{const r=await fetch(FIREBASE_URL+'/top10.json');const o=await r.json();list=Object.values(o||{})}catch(_){}}
  else list=localBoard();
  return topTen(list);
}
async function postScore(name,sc){
  const rec={name,score:sc,t:Date.now()};
  if(FIREBASE_URL){
    try{
      const r=await fetch(FIREBASE_URL+'/top10.json');const o=await r.json();
      const top=topTen(Object.values(o||{}).concat([rec]));
      await fetch(FIREBASE_URL+'/top10.json',{method:'PUT',body:JSON.stringify(top)});
    }catch(_){}
  }else{try{localStorage.setItem('pm_board',JSON.stringify(topTen(localBoard().concat([rec]))))}catch(_){}}
}
function renderBoard(el,list,nm,sc){
  el.textContent='';
  if(!list.length){const li=document.createElement('li');li.textContent='No scores yet - be the first!';el.appendChild(li);return}
  list.forEach((x,i)=>{
    const li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b');
    a.textContent=(i+1)+'. '+x.name;b.textContent=x.score;li.appendChild(a);li.appendChild(b);
    if(nm&&x.name===nm&&x.score===sc)li.className='me';
    el.appendChild(li);
  });
}
async function showStart(){
  document.getElementById('start').style.display='flex';
  document.getElementById('nm').value=playerName;
  document.getElementById('lbnote').textContent=FIREBASE_URL?'':'Scores are saved on this device only.';
  renderBoard(document.getElementById('lb1'),await loadBoard());
}
async function saveScore(){
  if(saved)return;saved=true;
  const sc=score,nm=playerName||'Player';
  if(sc<=0)return;
  await postScore(nm,sc);
  const list=await loadBoard();
  const rk=list.findIndex(x=>x.name===nm&&x.score===sc)+1;
  document.getElementById('ms').textContent='Score '+sc+(rk?' \u2022 Rank #'+rk:'');
  renderBoard(document.getElementById('lb2'),list.slice(0,5),nm,sc);
}
document.getElementById('go').onclick=()=>{
  const inp=document.getElementById('nm'),v=inp.value.trim().slice(0,14);
  if(!v){inp.style.borderColor='#ff5a5a';inp.focus();return}
  playerName=v;try{localStorage.setItem('pm_name',v)}catch(_){}
  document.getElementById('start').style.display='none';
  A();reset();
};
document.getElementById('nm').onkeydown=e=>{if(e.key==='Enter')document.getElementById('go').onclick()};
document.getElementById('menu').onclick=()=>{document.getElementById('msg').style.display='none';showStart()};
reset();fit();over=true;showStart();
if(window.ResizeObserver)new ResizeObserver(fit).observe(document.getElementById('wrap'));
addEventListener('resize',fit);
requestAnimationFrame(loop);
